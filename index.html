<!-- progress-scope:start v1.0.0 — 실습 항해도 공통 「진도 영역」 (Hands-On-Roadmap/templates/progress-scope.html에서 관리, 직접 고치지 말 것) -->
<script>
/* 진도 영역: 같은 브라우저를 여러 사람(게스트 이용권·회원)이 써도 진도가 섞이지 않게 합니다. <head>에서 앱보다 먼저 실행됩니다.
   - 클라우드 허브가 HTML을 내줄 때 쿠키 hangdo_scope에 이 사람·이용권의 진도 영역(추측할 수 없는 값, 게스트 g…·회원 m…)을 알려 줍니다.
     로컬·단독 실행에는 쿠키가 없어 영역은 'local'이고, 아무것도 바꾸지 않습니다(기존과 같음).
   - 지금 진도 키(<id>-hangdo-v1 등)에 들어 있는 것이 다른 영역의 진도면, 그것을 hangdo-scope:<영역>:<키>로 옮겨 두고
     이 영역에 보관해 둔 진도를 꺼내 원래 키에 넣습니다. 그래서 각 앱은 지금처럼 원래 키(storageKey)만 읽으면 됩니다.
   - 이용권 id·세션·쿠키 값은 저장하지 않습니다. 오래된 게스트 영역은 최근 6개만 남기고 지웁니다.
   - 한 번만 하는 이전(hangdo-progress-migration = 1): 클라우드에서 영역 표시가 없는 예전 진도는 누구의 것인지 알 수 없으므로
     어느 영역에도 넣지 않고 hangdo-backup:v1:<키>로 옮겨 둡니다(지우지 않음, 서버에 자동으로 올리지 않음). 회원은 포털에서 직접 복원할 수 있습니다.
   - 게스트: 게스트 범위 밖(중급·고급) 과정은 「마지막으로 연 과정」·완료 기록에 저장하지 않습니다.
   - 잠긴 과정 안내의 「이전 화면으로」(#hangdo-back) 링크를 뒤로 가기로 처리합니다.
   - 여러 탭: 진도를 쓰기 직전마다 지금 쿠키의 영역이 이 탭이 열릴 때의 영역과 같은지 확인하고, 다르면 쓰지 않고 「사용자 또는 세션 상태가 변경되었습니다」를 보여 줍니다.
     BroadcastChannel(없으면 storage 이벤트·화면 복귀 때 확인)으로 다른 탭에 바로 알립니다. 예전 진도는 지우지 않습니다. */
(() => {
  const MARK = 'hangdo-progress-scope', INDEX = 'hangdo-progress-scopes', KEEP_GUEST = 6;
  const MIG = 'hangdo-progress-migration', MIG_V = '1', BACKUP = 'hangdo-backup:v1:';
  const GUEST_LOCKED = ['intermediate', 'advanced', '중급', '고급'];   // tools/build_static.py GUEST_LOCKED_LEVELS와 같음
  const isApp = k => /^[a-z0-9-]+-hangdo-v1$/.test(k);
  const isProgress = k => isApp(k) || k === 'hangdo-portal-recent' || k === 'hangdo-portal-track';
  let want = 'local';
  try { const m = document.cookie.match(/(?:^|;\s*)hangdo_scope=([A-Za-z0-9_-]{8,40})(?:;|$)/); if (m) want = m[1]; } catch (e) {}
  let ls; try { ls = localStorage; } catch (e) { return; }   // 저장소를 쓸 수 없는 환경: 아무것도 하지 않음
  const keys = (prefix, test) => { const out = []; for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (prefix ? k.startsWith(prefix) : test(k)) out.push(k); } return out; };
  try {
    let cur = ls.getItem(MARK);
    if (ls.getItem(MIG) !== MIG_V) {
      if (cur === null && want !== 'local') {   // 출처를 알 수 없는 예전 진도 → 백업 (이미 있는 백업은 덮지 않음)
        const old = keys('', isProgress);
        old.forEach(k => { if (ls.getItem(BACKUP + k) === null) ls.setItem(BACKUP + k, ls.getItem(k)); ls.removeItem(k); });
        if (old.length) ls.setItem(BACKUP + 'at', String(Date.now()));
        cur = want; ls.setItem(MARK, want);
      }
      ls.setItem(MIG, MIG_V);
    }
    if (cur === null && want === 'local') { ls.setItem(MARK, 'local'); cur = 'local'; }   // 로컬·단독 실행: 표시만 남기고 그대로
    if (cur !== want) {
      const from = cur === null ? 'local' : cur;
      keys('', isProgress).forEach(k => { ls.setItem(`hangdo-scope:${from}:${k}`, ls.getItem(k)); ls.removeItem(k); });
      const pre = `hangdo-scope:${want}:`;
      keys(pre).forEach(k => { ls.setItem(k.slice(pre.length), ls.getItem(k)); ls.removeItem(k); });
      ls.setItem(MARK, want);
      let idx = {}; try { idx = JSON.parse(ls.getItem(INDEX) || '{}') || {}; } catch (e) {}
      idx[from] = Date.now(); delete idx[want];
      Object.keys(idx).filter(s => s.charAt(0) === 'g').sort((a, b) => idx[b] - idx[a]).slice(KEEP_GUEST).forEach(s => {
        keys(`hangdo-scope:${s}:`).forEach(k => ls.removeItem(k)); delete idx[s];
      });
      ls.setItem(INDEX, JSON.stringify(idx));
    }
  } catch (e) { /* 저장 공간 부족 등: 그대로 둠 */ }

  // ---- 여러 탭 보호: 이 탭이 열릴 때의 영역(TAB)과 지금 쿠키의 영역이 다르면(다른 탭에서 로그아웃·다른 사람 로그인) 진도를 쓰지 않음 ----
  const TAB = want;
  const cookieScope = () => { try { const m = document.cookie.match(/(?:^|;\s*)hangdo_scope=([A-Za-z0-9_-]{8,40})(?:;|$)/); return m ? m[1] : 'local'; } catch (e) { return TAB; } };
  const stale = () => { if (cookieScope() !== TAB) return true; try { const m = ls.getItem(MARK); return m !== null && m !== TAB; } catch (e) { return false; } };
  const guarded = k => isProgress(k) || k.startsWith('hangdo-scope:') || k.startsWith('hangdo-backup:') || k === MARK || k === INDEX || k === MIG;
  let warned = false;
  const warn = () => {
    if (warned) return; warned = true;
    const show = () => {
      const d = document.createElement('div');
      d.id = 'hangdo-scope-alert'; d.setAttribute('role', 'alert');
      d.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:2147483000;max-width:min(560px,calc(100vw - 32px));padding:12px 16px;border-radius:12px;font:14px/1.5 system-ui,sans-serif;background:#fff4d6;color:#3d2c00;border:1px solid #e0b84a;box-shadow:0 6px 24px rgba(0,0,0,.18)';
      d.innerHTML = '<b>사용자 또는 세션 상태가 변경되었습니다.</b><div>다른 탭에서 로그인·로그아웃했거나 세션이 만료되어 이 탭은 진도를 더 저장하지 않습니다(이미 저장된 진도는 지우지 않았습니다). 새로고침하면 지금 상태로 이어집니다.</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><button type="button" data-a="reload" style="font:inherit;padding:4px 12px;border-radius:8px;border:1px solid #b08a1e;background:#fff;cursor:pointer">새로고침</button><a href="/" style="padding:4px 12px;border-radius:8px;border:1px solid #b08a1e;color:inherit;text-decoration:none;background:#fff">현재 사용자 화면(포털)으로</a></div>';
      d.querySelector('[data-a=reload]').onclick = () => location.reload();
      document.body.appendChild(d);
    };
    if (document.body) show(); else document.addEventListener('DOMContentLoaded', show);
  };
  const orig = Storage.prototype.setItem, origRemove = Storage.prototype.removeItem;
  let filter = null;   // 게스트 잠금 걸러 내기 (아래에서 설정)
  Storage.prototype.setItem = function (k, v) {
    if (this === ls) {
      k = String(k);
      if (guarded(k) && stale()) { warn(); return; }      // 다른 사람의 활성 키·영역 백업 키에 쓰지 않음
      if (filter && isApp(k)) v = filter(k, String(v));
    }
    return orig.call(this, k, v);
  };
  Storage.prototype.removeItem = function (k) {
    if (this === ls && guarded(String(k)) && stale()) { warn(); return; }
    return origRemove.call(this, k);
  };
  window.hangdoScopeOk = () => !stale();                 // progress-sync가 서버에 올리기 전에 확인
  try {                                                   // 즉시 알림: 같은 사이트의 다른 탭에 「이 탭의 영역」을 알림
    const bc = new BroadcastChannel('hangdo-scope');
    bc.onmessage = e => { if (e.data && typeof e.data.scope === 'string' && e.data.scope !== TAB) warn(); };
    bc.postMessage({ scope: TAB });
  } catch (e) { /* BroadcastChannel이 없으면 아래 storage 이벤트·쓰기 직전 검사로 대신 */ }
  addEventListener('storage', e => { if (e.key === MARK && e.newValue !== null && e.newValue !== TAB) warn(); });
  const recheck = () => { if (cookieScope() !== TAB) warn(); };
  document.addEventListener('visibilitychange', () => { if (!document.hidden) recheck(); });
  addEventListener('focus', recheck);

  // 안내 문서의 「이전 화면으로」(…#hangdo-back) 링크: 브라우저 뒤로 가기 (기록이 없으면 포털)
  document.addEventListener('click', e => {
    const a = e.target.closest && e.target.closest('a[href$="#hangdo-back"]'); if (!a) return;
    e.preventDefault(); e.stopPropagation();
    if (history.length > 1) history.back(); else location.href = '/';
  }, true);

  // ---- 게스트가 항해도 화면(/<id>/)에 있을 때: 잠긴 과정을 「마지막 과정」·완료 기록에 남기지 않음 ----
  // 저장 값뿐 아니라 앱 메모리의 상태 객체도 바로 고침: 앱이 JSON.stringify(상태)를 곧바로 setItem 하므로, 방금 문자열로 만든 객체를 기억해 두었다가 같은 객체를 고침
  if (want.charAt(0) !== 'g' || !/^\/[a-z0-9-]+\/(index\.html)?$/.test(location.pathname)) return;
  let locked = null;
  const before = {}, live = {};   // before: 이 화면에서 앱이 쓰기 전 값, live: 앱이 마지막으로 저장한 상태 객체(메모리)
  try { keys('', isApp).forEach(k => { before[k] = ls.getItem(k); }); } catch (e) {}
  const parse = raw => { try { const s = JSON.parse(raw); return s && typeof s === 'object' ? s : null; } catch (e) { return null; } };
  const fix = (s, prev) => {      // s를 그 자리에서 고침, 바뀌었으면 true
    let changed = false;
    if (s.last && typeof s.last === 'object') {
      Object.keys(s.last).forEach(k => {
        if (!GUEST_LOCKED.includes(k) && !locked.has(s.last[k])) return;
        const pv = prev.last && typeof prev.last === 'object' ? prev.last[k] : undefined;
        if (k === 'global' && pv && !locked.has(pv)) s.last[k] = pv; else delete s.last[k];
        changed = true;
      });
    } else if (typeof s.last === 'string' && locked.has(s.last)) {   // 마지막 과정을 문자열 하나로 두는 앱
      s.last = typeof prev.last === 'string' && !locked.has(prev.last) ? prev.last : ''; changed = true;
    }
    ['progress', 'started', 'done'].forEach(f => { if (s[f] && typeof s[f] === 'object' && !Array.isArray(s[f])) Object.keys(s[f]).forEach(id => { if (locked.has(id)) { delete s[f][id]; changed = true; } }); });
    return changed;
  };
  const origStringify = JSON.stringify;
  let made = null;
  JSON.stringify = function (value, ...rest) { const out = origStringify.call(this, value, ...rest); if (value && typeof value === 'object') made = [value, out]; return out; };
  filter = (k, v) => {
    const obj = made && made[1] === v ? made[0] : null; made = null;
    if (obj) live[k] = obj;
    if (!locked) return v;
    const prev = parse(ls.getItem(k)) || {};
    if (obj) return fix(obj, prev) ? origStringify(obj) : v;
    const s = parse(v); return s && fix(s, prev) ? origStringify(s) : v;
  };
  fetch('content/catalog.json', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(cat => {
    if (!cat || !Array.isArray(cat.items)) return;
    locked = new Set(cat.items.filter(i => GUEST_LOCKED.includes(i.level)).map(i => i.id));
    keys('', isApp).forEach(k => {                        // 목록을 받기 전에 저장된 것(메모리 포함)도 정리
      if (stale()) return;
      const prev = parse(before[k]) || {}, obj = live[k] || parse(ls.getItem(k));
      if (obj && fix(obj, prev)) orig.call(ls, k, origStringify(obj));
    });
  }).catch(() => {});
})();
</script>
<!-- progress-scope:end -->
<!-- theme-toggle:start v1.0.0 — 실습 항해도 공통 「테마 바꾸기」 (Hands-On-Roadmap/templates/theme-toggle.html에서 관리, 직접 고치지 말 것) -->
<style>
.theme-toggle { position: fixed; left: 16px; bottom: 16px; z-index: 59; display: inline-flex; align-items: center; gap: 6px;
  font: 500 .8rem/1 var(--font-body, system-ui, sans-serif); color: var(--ink, #142231); background: var(--sheet, #fff);
  border: 1px solid var(--rule, #d3dce4); border-radius: 99px; padding: 7px 12px; cursor: pointer; box-shadow: 0 2px 10px rgb(0 0 0 / .08); }
.theme-toggle:hover { border-color: var(--chart, #1d5bb8); }
.theme-toggle:focus-visible { outline: 2px solid var(--chart, #1d5bb8); outline-offset: 2px; }
@media print { .theme-toggle { display: none; } }
</style>
<script>
/* 테마: 자동(시스템 설정) → 밝게 → 어둡게 순서로 바뀝니다. 선택은 브라우저에 저장되어 허브의 모든 항해도·포털·심화 노트가 같이 따릅니다.
   페이지 CSS의 :root[data-theme="light|dark"] 규칙을 씁니다. 그리기 전에 적용하려고 <head>에 둡니다. */
(() => {
  const KEY = 'hangdo-theme', MODES = ['auto', 'light', 'dark'];
  const LABEL = { auto: '🌓 자동', light: '☀️ 밝게', dark: '🌙 어둡게' };
  const get = () => { try { const v = localStorage.getItem(KEY); return MODES.includes(v) ? v : 'auto'; } catch (e) { return 'auto'; } };
  const apply = m => { if (m === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.dataset.theme = m; };
  apply(get());
  addEventListener('storage', e => { if (e.key === KEY) { apply(get()); paint(); } });   // 다른 탭에서 바꾸면 따라감
  let btn;
  const paint = () => { if (!btn) return; const m = get();
    btn.textContent = LABEL[m]; btn.title = `테마: ${LABEL[m].slice(3)} — 누르면 ${LABEL[MODES[(MODES.indexOf(m) + 1) % 3]].slice(3)}`;
    btn.setAttribute('aria-label', btn.title); };
  const mount = () => {
    if (document.querySelector('.theme-toggle')) return;
    btn = document.createElement('button'); btn.type = 'button'; btn.className = 'theme-toggle';
    btn.onclick = () => { const m = MODES[(MODES.indexOf(get()) + 1) % 3]; try { localStorage.setItem(KEY, m); } catch (e) {} apply(m); paint(); };
    document.body.appendChild(btn); paint();
  };
  document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', mount) : mount();
})();
</script>
<!-- theme-toggle:end -->
<style>
/* Layout concept: 해도(chart) 위의 항로. 상단 고정 항해 바, 왼쪽 수준별 항로(목차), 가운데 65자 폭 본문, 넓은 화면에서 오른쪽 이 페이지 목차. */
:root {
  --paper: #f2f5f7;        /* 해도 종이 */
  --sheet: #ffffff;        /* 본문 면 */
  --ink: #142231;          /* 본문 잉크 */
  --muted: #566778;        /* 보조 글 */
  --rule: #d3dce4;         /* 선 */
  --chart: #1d5bb8;        /* 항로 청색 (강조) */
  --chart-soft: #e3ecf8;
  --buoy: #c2410c;         /* 부표 주황 (예정·주의) */
  --buoy-soft: #fbeee6;
  --ok: #24773a; --ok-soft: #e4f2e7;
  --warn: #946200; --warn-soft: #fbf1d9;
  --bad: #b42323; --bad-soft: #f9e4e4;
  --code-bg: #0f1b27; --code-ink: #dbe6f0; --code-dim: #8aa0b5;
  --font-display: "Hahmlet", "Noto Serif KR", "Apple SD Gothic Neo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", "D2Coding", "Nanum Gothic Coding", ui-monospace, Menlo, Consolas, monospace;
  --step-0: 1rem; --step-1: 1.125rem; --step-2: 1.375rem; --step-3: 1.75rem; --step-4: 2.25rem;
  --radius: 6px;
  --header-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0d1621; --sheet: #121e2b; --ink: #e2eaf2; --muted: #95a6b7; --rule: #26394c;
    --chart: #7eaefc; --chart-soft: #172b45; --buoy: #ff9a62; --buoy-soft: #3a2116;
    --ok: #7dd396; --ok-soft: #16301f; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8f8f; --bad-soft: #3b1818;
    --code-bg: #08111a; --code-ink: #dbe6f0; --code-dim: #7f95aa;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0d1621; --sheet: #121e2b; --ink: #e2eaf2; --muted: #95a6b7; --rule: #26394c;
  --chart: #7eaefc; --chart-soft: #172b45; --buoy: #ff9a62; --buoy-soft: #3a2116;
  --ok: #7dd396; --ok-soft: #16301f; --warn: #f0c060; --warn-soft: #33290f; --bad: #ff8f8f; --bad-soft: #3b1818;
  --code-bg: #08111a; --code-ink: #dbe6f0; --code-dim: #7f95aa;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header-h) + 16px); }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: var(--step-0); line-height: 1.7; margin: 0; word-break: keep-all; overflow-wrap: anywhere; }
a { color: var(--chart); text-underline-offset: 3px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--chart); outline-offset: 2px; border-radius: 3px; }
button, select, input, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.3; }
h1, h2 { font-family: var(--font-display); font-weight: 700; letter-spacing: -0.01em; }
h3, h4 { font-weight: 700; }
code, pre, kbd { font-family: var(--font-mono); font-size: 0.9em; }
:not(pre) > code { background: var(--chart-soft); padding: 0.1em 0.35em; border-radius: 4px; overflow-wrap: anywhere; white-space: normal; }
/* 표 칸은 단어 단위로 줄바꿈 (anywhere는 칸 최소 폭을 한 글자로 만들어 「1.32」·날짜까지 꺾임). 긴 코드는 위 규칙대로 어디서나 꺾임 */
.prose td, .prose th { overflow-wrap: break-word; }
.prose td:first-child strong { white-space: nowrap; }

function factsFor(i) {
  const m = i.minutes || {};
  const vers = C.versions.map(v => `${v.minor}${supports(i, v.minor) ? ' ✓' : ' ✕'}`).join(' · ');
  const comps = (i.components || []).map(c => `<li>${esc(c.name)} <span class="chip">${c.kind === 'core' ? 'Kubernetes 기능' : c.kind === 'addon' ? '애드온·외부 구성 요소' : '외부 생태계 도구'}</span>${c.version ? ` <code>${esc(c.version)}</code>` : ''}</li>`).join('');
  const imgs = (i.images || []).map(x => `<li><code>${esc(x)}</code></li>`).join('');
  const prereq = (i.prereq || []).map(id => ITEM[id] ? `<li><a href="#/item/${id}">${esc(ITEM[id].title)}</a></li>` : `<li>${esc(id)}</li>`).join('');
  const docs = (i.docs || []).map(d => `<li><a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)}</a></li>`).join('');
  return `<dl class="facts">
    <div><dt>예상 시간</dt><dd>개념 ${fmtMin(m.concept)} · 핸즈온 ${fmtMin(m.handson)} · 복습 ${fmtMin(m.review)}</dd></div>

    <div><dt>실습 환경</dt><dd>${esc(i.env || '해당 없음')}</dd></div>
    ${prereq ? `<div><dt>선수 과정</dt><dd><ul>${prereq}</ul></dd></div>` : ''}
    ${comps ? `<div><dt>사용 구성 요소</dt><dd><ul>${comps}</ul></dd></div>` : ''}
    ${imgs ? `<div><dt>컨테이너 이미지</dt><dd><ul>${imgs}</ul></dd></div>` : ''}
    ${docs ? `<div><dt>공식 문서</dt><dd><ul>${docs}</ul></dd></div>` : ''}
    <div><dt>검증 상태 · 마지막 확인</dt><dd>${verChip(i) || '<span class="chip planned">예정</span>'} ${esc(i.lastChecked || C.meta.lastChecked)}<br><span style="font-size:.85rem;color:var(--muted)">${esc((i.verification || {}).summary || '')}</span></dd></div>
  </dl>`;
}

function textOf(i) { return [i.title, i.summary, i.purpose, (i.tags || []).join(' '), (i.outline || []).join(' '), mdPlain(mdCache[i.file] || '')].join(' ').toLowerCase(); }
function drawLabs() {

function hlq(s, q) { let h = esc(s); if (!q) return h; q.split(/\s+/).filter(Boolean).forEach(w => { h = h.replace(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), x => `<mark>${x}</mark>`); }); return h; }

/* ---------- 검색 ---------- */
let searchReady = null;
function loadAll() { if (!searchReady) searchReady = Promise.all([...C.items.filter(i => i.file && i.status === 'published').map(i => loadMd(i.file).catch(() => '')), ...C.levels.map(L => loadMd(L.guide).catch(() => '')), ...C.pages.map(p => loadMd(p.file).catch(() => ''))]); return searchReady; }
async function renderSearch(q) {
  setNav(null); setSide(null);
  setMain('<p class="loading">검색 중…</p>');
  await loadAll();
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const docs = [
    ...C.items.map(i => ({ href: '#/item/' + i.id, title: i.title, meta: `${LV[i.level] ? LV[i.level].name : '준비'} · ${typeName(i.type)}${i.status === 'planned' ? ' · 예정' : ''}`, text: [i.title, i.summary, (i.outline || []).join(' '), mdPlain(mdCache[i.file] || '')].join('\n') })),
    ...C.levels.map(L => ({ href: '#/level/' + L.id, title: L.name + ' 과정 가이드', meta: '이렇게 학습하세요', text: mdPlain(mdCache[L.guide] || '') })),
    ...C.pages.map(p => ({ href: p.href, title: p.title, meta: '문서', text: mdPlain(mdCache[p.file] || '') })),
    ...G.map(g => ({ href: '#/glossary/' + g.id, title: `${g.ko} (${g.en})`, meta: '용어집', text: g.desc }))
  ];
  const res = docs.map(d => { const low = (d.title + '\n' + d.text).toLowerCase(); if (!words.every(w => low.includes(w))) return null;
    const score = words.reduce((a, w) => a + (d.title.toLowerCase().includes(w) ? 10 : 0) + low.split(w).length, 0);
    const pos = d.text.toLowerCase().indexOf(words[0]); const snip = pos >= 0 ? d.text.slice(Math.max(0, pos - 60), pos + 120).replace(/\s+/g, ' ') : '';
    return { ...d, score, snip }; }).filter(Boolean).sort((a, b) => b.score - a.score);
  setMain(`<div class="page-head"><div class="eyebrow">검색</div><h1>「${esc(q)}」 검색 결과</h1><p class="lede">${res.length}건</p></div>

let lastQuery = '';
async function route() {

  try {
    switch (parts[0]) {
      case '': return renderHome();
      case 'roadmap': return renderRoadmap();
      case 'level': return await renderLevel(parts[1]);
      case 'item': return await renderItem(parts[1]);
      case 'setup': return await renderItem('setup');
      case 'labs': return renderLabs();
      case 'versions': return await renderDoc('content/pages/versions.md', 'versions', '버전 정보', 'Kubernetes 버전 비교', '지원 중인 최근 3개 마이너 버전의 주요 변경, 기능 단계, 지원 종료, 폐기·제거 API와 마이그레이션 방법입니다.');
      case 'history': return await renderDoc('content/pages/history.md', 'history', '읽을거리', '쿠버네티스 버전의 역사', '1.0(2015)부터 1.37(2026)까지 마이너 버전 38개에서 무엇이 강조되고, 무엇이 사라지고(EOS·제거), 무엇이 바뀌어 지금에 이르렀는지 시대별로 정리합니다. 실습 없이 읽는 자료입니다.');
      case 'verification': return await renderDoc('content/pages/verification.md', 'verification', '품질 기록', '검증 보고서', '예제를 실제로 실행한 환경과 결과, 그리고 검증하지 못한 범위를 숨김없이 기록합니다.');
      case 'glossary': return renderGlossary(parts[1]);
      case 'search': return await renderSearch(parts.slice(1).join('/'));
      default:
        if (ITEM[parts[0]]) return await renderItem(parts[0]);
        if (LV[parts[0]]) return await renderLevel(parts[0]);

}

.deep-peek b small { font-family: var(--font-mono); font-weight: 400; color: var(--muted); margin-left: 4px; }
.deep-peek p { margin: 0 0 6px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.deep-peek .hint { color: var(--chart); font-size: .78rem; }
@media (max-width: 1099px) { body.deep-pinned { margin-right: 0; } body.deep-pinned .deep-scrim { display: block; } #deepPin { display: none; } }
</style>
<div class="deep-scrim" id="deepScrim"></div>
<aside class="deep-drawer" id="deepDrawer" role="dialog" aria-labelledby="deepTitle" aria-hidden="true">
  <div class="deep-head">
    <div><button class="deep-back" id="deepBack"></button><p class="eyebrow" id="deepEyebrow">용어</p><h2 id="deepTitle"></h2></div>
    <div class="deep-tools">
      <button class="deep-btn" id="deepPin" aria-pressed="false" title="본문 옆에 고정">📌 고정</button>
      <button class="deep-btn" id="deepClose" aria-label="닫기" title="닫기 (Esc)">×</button>
    </div>
  </div>
  <div class="deep-body" id="deepBody"></div>
  <div class="deep-foot" id="deepFoot"></div>

<div class="deep-peek" id="deepPeek" role="tooltip"></div>
<script>
/* 심화 노트 서랍: 본문 용어 [[id]] → 마우스 올리면 미리보기, 클릭하면 서랍(용어 설명 + 심화 노트).
   심화 노트 서비스(/deep/)는 선택 의존 — 꺼져 있거나 단독 실행이면 용어 설명만 보여 줍니다. */
(() => {
  const DEEP = '/deep/';
  const SITE = location.pathname.split('/')[1] || '';   // 허브·컨테이너에서는 항해도 id (예: /k8s/), 폴더 단독 실행이면 ''
  const $ = id => document.getElementById(id);
  const drawer = $('deepDrawer'), scrim = $('deepScrim'), peek = $('deepPeek');
  const gloss = fetch('content/glossary.json').then(r => r.json()).then(d => Object.fromEntries((d.terms || d).map(t => [t.id, t]))).catch(() => ({}));
  const index = fetch(DEEP + 'content/index.json', { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null).then(d => {
    if (!d) return null;
    // all: 노트 안 링크·뒤로 가기용 전체 목록 · site: 이 항해도 용어에 붙일 노트만 (노트의 roadmaps에 이 항해도가 있을 때).
    // 같은 용어 id가 항해도마다 다른 뜻일 수 있어서(리눅스 service = systemd, 도커 namespace = 커널) 항해도별로 거릅니다.
    const all = {}, site = {};
    d.groups.flatMap(g => g.notes).forEach(n => [n.id, ...(n.aliases || [])].forEach(k => {
      all[k] = n; if (!SITE || !n.roadmaps || n.roadmaps.includes(SITE)) site[k] = n; }));
    return { all, site };
  });
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const idOf = a => decodeURIComponent((a.getAttribute('href') || '').split('/glossary/')[1] || '');
  const OPEN_FIRST = ['한 줄 요약', '동작 흐름'];
  const history = []; let current = null, lastFocus = null;

  // 용어 링크의 기본 title 툴팁은 미리보기 카드와 겹치므로 지우고, 같은 문장을 화면 낭독기용 설명(aria-label 보조)으로 옮김
  const untitle = () => document.querySelectorAll('a.term[title]').forEach(a => {
    a.dataset.tip = a.getAttribute('title'); a.removeAttribute('title');
    if (!a.hasAttribute('aria-describedby')) a.setAttribute('aria-describedby', 'deepPeek'); });
  const mark = async () => { untitle(); const idx = await index; if (!idx) return;
    document.querySelectorAll('a.term').forEach(a => a.classList.toggle('has-deep', idx.site[idOf(a)]?.status === 'ready')); };
  new MutationObserver(mark).observe(document.body, { childList: true, subtree: true });

  // 미리보기 카드 (마우스 · 키보드 포커스)
  let peekTimer, peekFor = null, quietFocus = false, resting = null;   // resting: 클릭한 용어 — 마우스가 한 번 벗어날 때까지 미리보기 쉼
  const drawerOpen = () => drawer.classList.contains('open');
  const showPeek = a => { if (drawerOpen()) return; clearTimeout(peekTimer); peekFor = a; peekTimer = setTimeout(async () => {
    if (drawerOpen() || peekFor !== a) return;                     // 그사이 클릭해 서랍이 열렸거나 다른 용어로 옮겨 감
    const [g, idx] = await Promise.all([gloss, index]); const id = idOf(a); const t = g[id]; if (!t) return;
    if (drawerOpen() || peekFor !== a) return;
    const n = idx && idx.site[id];
    peek.innerHTML = `<b>${esc(t.ko)}<small>${esc(t.en)}</small></b><p>${esc(t.desc || t.short || '')}</p>
      <span class="hint">${n?.status === 'ready' ? `🔎 심화 노트 약 ${n.minutes}분 — 클릭해서 열기` : '클릭해서 용어 설명 열기'}</span>`;
    const r = a.getBoundingClientRect();
    peek.style.left = Math.max(8, Math.min(window.scrollX + r.left, window.scrollX + document.documentElement.clientWidth - 336)) + 'px';
    peek.style.top = (window.scrollY + r.bottom + 8) + 'px';
    peek.classList.add('show'); }, 250); };
  const hidePeek = () => { clearTimeout(peekTimer); peekFor = null; peek.classList.remove('show'); };
  // 마우스는 올려 둘 때만, 터치는 미리보기 없이 누르면 바로 상세 서랍 (터치의 가짜 hover 무시)
  document.addEventListener('pointerover', e => { if (e.pointerType !== 'mouse') return; const a = e.target.closest('a.term'); if (a && a !== resting && !drawer.contains(a)) showPeek(a); });
  document.addEventListener('pointerout', e => { const a = e.target.closest('a.term'); if (a && !a.contains(e.relatedTarget)) { hidePeek(); if (a === resting && !drawerOpen()) resting = null; } });
  document.addEventListener('focusin', e => { const a = e.target.closest && e.target.closest('a.term');
    if (a && !drawer.contains(a) && !quietFocus && a.matches(':focus-visible')) showPeek(a); });   // 키보드(Tab)로 왔을 때만
  document.addEventListener('focusout', e => { if (e.target.closest && e.target.closest('a.term')) hidePeek(); });
  addEventListener('scroll', hidePeek, { passive: true });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && peek.classList.contains('show')) hidePeek(); });

  document.addEventListener('click', e => {
    const a = e.target.closest('a.term'); if (!a || drawer.contains(a)) return;
    const id = idOf(a); if (!id) return;
    e.preventDefault(); e.stopPropagation(); hidePeek(); resting = a;
    history.length = 0; lastFocus = a; show(id);
  }, true);

  drawer.addEventListener('click', e => {
    const l = e.target.closest('a.deep-link'); if (!l) return;
    e.preventDefault(); if (current) history.push(current); show(l.dataset.id, true, true);
  });
  $('deepBack').onclick = () => { const prev = history.pop(); if (prev) show(prev, true, true); };

  function fold(html) {   // h2 단위로 접기 — 요약·동작 흐름만 펼침
    const box = document.createElement('div'); box.innerHTML = html;
    const out = document.createElement('div'); let cur = null;
    [...box.childNodes].forEach(node => {
      if (node.nodeName === 'H2') {
        cur = document.createElement('details');
        if (OPEN_FIRST.some(t => node.textContent.trim().startsWith(t))) cur.open = true;
        const s = document.createElement('summary'); s.innerHTML = node.innerHTML; cur.appendChild(s); out.appendChild(cur);
      } else (cur || out).appendChild(node);
    });
    return out.innerHTML;
  }
  const linkify = (md, g, all) => md.replace(/\[\[([\w-]+)\]\]/g, (m, id) => `<a class="deep-link" data-id="${id}" href="#">${esc((g[id] || {}).en || (all[id] || {}).title || id)}</a>`);

  async function show(id, keepFocus, fromNote) {
    const [g, idx] = await Promise.all([gloss, index]);
    current = id;
    const note = idx && (fromNote ? idx.all : idx.site)[id];
    const t = g[id] || (note ? { ko: note.ko, en: note.title, desc: note.summary } : { ko: id, en: id, desc: '' });
    $('deepTitle').innerHTML = `${esc(t.ko)}<small>${esc(t.en)}</small>`;
    $('deepEyebrow').textContent = note?.status === 'ready' ? '용어 · 심화 노트' : '용어';
    const prev = history[history.length - 1];
    $('deepBack').className = 'deep-back' + (prev ? ' show' : '');
    $('deepBack').textContent = prev ? `← ${(g[prev] || idx?.all[prev] || {}).ko || prev}` : '';
    let html = `<div class="deep-gloss"><p>${esc(t.desc || t.short || '')}</p>${t.doc ? `<a href="${esc(t.doc)}" target="_blank" rel="noopener">공식 문서 ↗</a>` : ''}</div>`;
    let foot = g[id] ? `<a href="#/glossary/${esc(id)}" id="deepToGloss">용어집에서 보기</a>` : '';
    if (!idx) html += `<p class="deep-chip">심화 노트 서비스에 연결할 수 없어요 — 용어 설명만 표시</p>`;
    else if (!note) html += `<p class="deep-chip">이 용어는 아직 심화 노트가 없어요</p>`;
    else if (note.status !== 'ready') html += `<div class="deep-divider">🔎 심화 노트 <span>준비 중</span></div><p>${esc(note.summary)}</p>`;
    else {
      const md = await fetch(`${DEEP}content/${encodeURIComponent(note.id)}.md`, { cache: 'no-cache' }).then(r => r.ok ? r.text() : '').catch(() => '');
      html += `<div class="deep-divider">🔎 심화 노트 <span>약 ${note.minutes}분 · ${(note.roadmaps || []).length}개 항해도에서 사용</span><button id="deepExpand">모두 펼치기</button></div>
               <div class="deep-note">${fold(window.marked ? window.marked.parse(linkify(flowSlots(md), g, idx.all)) : `<pre>${esc(md)}</pre>`)}</div>`;
      foot = `<a href="${DEEP}#/note/${esc(note.id)}" target="_blank" rel="noopener">전체 화면으로 보기 ↗</a>` + foot;
    }
    $('deepBody').innerHTML = html; $('deepFoot').innerHTML = foot; $('deepBody').scrollTop = 0;
    if ($('deepBody').querySelector('[data-flow]')) flow().then(F => F && F.render($('deepBody'), DEEP));   // 흐름 그림 (서랍 폭이면 타임라인)
    const tg = $('deepToGloss'); if (tg) tg.onclick = () => close();
    const ex = $('deepExpand'); if (ex) ex.onclick = () => { const all = [...drawer.querySelectorAll('.deep-note details')]; const openAll = all.some(d => !d.open); all.forEach(d => { d.open = openAll; }); ex.textContent = openAll ? '요약만 보기' : '모두 펼치기'; };
    hidePeek(); drawer.classList.add('open'); drawer.setAttribute('aria-hidden', 'false');
    if (wantPin() && window.innerWidth >= 1100) setPin(true);
    if (!document.body.classList.contains('deep-pinned')) scrim.classList.add('open');
    if (!keepFocus) $('deepClose').focus();
  }
  // ```flow 블록은 항해도의 코드 블록 렌더러를 거치지 않도록 미리 자리(div)로 바꿈 (flow.js의 prepare와 같은 규칙)
  const flowSlots = md => md.replace(/^```flow[ \t]*\n\s*([\w-]+)\s*\n```[ \t]*$/gm, (m, id) => `\n<div class="dflow-slot" data-flow="${id}"></div>\n`);
  let flowJs;   // 심화 노트 서비스의 그림 렌더러 — 그림이 있는 노트를 처음 열 때 한 번만 불러옴
  const flow = () => flowJs = flowJs || new Promise(ok => { const s = document.createElement('script');
    s.src = DEEP + 'vendor/flow.js'; s.onload = () => ok(window.DeepFlow); s.onerror = () => ok(null); document.head.appendChild(s); });
  function close() {
    drawer.classList.remove('open'); scrim.classList.remove('open'); drawer.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('deep-pinned'); $('deepPin').setAttribute('aria-pressed', 'false');
    hidePeek();
    if (lastFocus) { quietFocus = true; lastFocus.focus(); setTimeout(() => { quietFocus = false; }, 0); }   // 닫은 뒤 원래 자리로 돌아가되 미리보기는 다시 띄우지 않음
  }
  const wantPin = () => { try { return localStorage.getItem('deep-pin') === '1'; } catch (e) { return false; } };
  function setPin(on, remember) {
    document.body.classList.toggle('deep-pinned', on); $('deepPin').setAttribute('aria-pressed', String(on));
    scrim.classList.toggle('open', !on && drawer.classList.contains('open'));
    if (remember) try { localStorage.setItem('deep-pin', on ? '1' : '0'); } catch (e) {}
  }
  $('deepPin').onclick = () => setPin(!document.body.classList.contains('deep-pinned'), true);
  $('deepClose').onclick = close; scrim.onclick = close;
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && drawer.classList.contains('open')) close(); });

  // 공유 링크: ?deep=<용어 id> 로 열면 서랍이 열린 채 시작
  const shared = new URLSearchParams(location.search).get('deep');
  if (shared) setTimeout(() => show(shared, true), 1200);
})();
</script>

<div class="hs-backdrop" id="hsBackdrop" hidden>

    <div class="hs-status" id="hsStatus"></div>

    <div class="hs-foot">↑↓ 이동 · Enter 열기 · Esc 닫기</div>

<script>
/* 통합 검색: 허브(/roadmaps.json)가 있을 때만 켜짐. 각 항해도·심화 노트가 내주는 catalog·glossary·index를 그 자리에서 모아 검색합니다. */
(() => {
  const $ = id => document.getElementById(id);
  const backdrop = $('hsBackdrop'), input = $('hsInput'), list = $('hsList'), status = $('hsStatus');
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const getJSON = u => fetch(u, { cache: 'no-cache' }).then(r => r.ok ? r.json() : null).catch(() => null);
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent);
  const EXAMPLES = ['etcd', '롤백', 'PromQL', '프로브', 'StorageClass', '사이드카', '부하'];
  let REG = null, DOCS = null, building = null, down = [], sel = 0, results = [], lastFocus = null;

  const ready = getJSON('/roadmaps.json').then(d => {
    if (!d || !d.roadmaps) return null;      // 단독 실행: 통합 검색 없음 (각 항해도 자체 검색 사용)
    REG = d;
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'hs-open'; btn.id = 'hsOpen';
    btn.innerHTML = `🔍 전체 검색 <kbd>${isMac ? '⌘K' : 'Ctrl K'}</kbd>`;
    btn.addEventListener('click', open);
    const slot = $('hsSlot'), hub = $('hubLink');
    if (slot) slot.appendChild(btn); else if (hub) hub.insertAdjacentElement('afterend', btn);
    else { btn.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:70'; document.body.appendChild(btn); }
    document.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); backdrop.hidden ? open() : close(); }
      else if (e.key === 'Escape' && !backdrop.hidden) { e.preventDefault(); e.stopPropagation(); close(); }
    }, true);
    return REG;
  });

  function build() {
    if (building) return building;
    building = (async () => {
      const docs = []; down = [];
      await Promise.all(REG.roadmaps.map(async r => {
        const [cat, gl] = await Promise.all([getJSON(`/${r.id}/content/catalog.json`), getJSON(`/${r.id}/content/glossary.json`)]);
        if (!cat) { down.push(r.title); return; }
        const aka = (r.aliases || []).join(' ');           // 바뀌기 전 이름(예: 도메인 → DNS·HTTPS)으로도 찾게
        docs.push({ kind: '항해도', where: r.title, aka, title: r.title + (aka ? ` (${aka})` : ''),
          text: [r.summary, ...(r.owns || []), ...(r.areas || [])].filter(Boolean).join(' · '), href: `/${r.id}/` });
        (cat.items || []).filter(i => i.status === 'published').forEach(i => docs.push({
          kind: '과정', where: r.title, aka, title: i.title,
          text: [i.summary, i.purpose, (i.outline || []).join(' · '), (i.tags || []).join(' ')].filter(Boolean).join(' — '),
          href: `/${r.id}/#/item/${i.id}` }));
        ((gl && (gl.terms || gl)) || []).forEach(t => docs.push({
          kind: '용어', where: r.title, aka, title: `${t.ko}${t.en && t.en !== t.ko ? ` (${t.en})` : ''}`,
          text: t.desc || t.short || '', href: `/${r.id}/?deep=${encodeURIComponent(t.id)}` }));
        // 읽을거리 페이지(버전 비교·버전의 역사·검증 보고서 …): ## 절마다 하나씩 색인
        await Promise.all((cat.pages || []).map(async pg => {
          const md = await fetch(`/${r.id}/${pg.file}`, { cache: 'no-cache' }).then(x => x.ok ? x.text() : '').catch(() => '');
          md.split(/^## /m).slice(1).forEach(sec => {
            const head = sec.split('\n', 1)[0].replace(/\{#[^}]*\}/g, '').trim();
            docs.push({ kind: '페이지', where: r.title, aka, title: `${pg.title} · ${head}`,
              text: sec.slice(head.length).replace(/```[\s\S]*?```/g, ' ').replace(/\[\[([\w-]+)(\|[^\]]*)?\]\]/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[#*|`>:-]+/g, ' ').replace(/\s+/g, ' ').slice(0, 1500),
              href: `/${r.id}/${pg.href}` });
          });
        }));
      }));
      const guide = await getJSON('/guide.json');           // 학습 가이드: 항해도마다 하나 + 전체 안내
      if (guide) {
        docs.push({ kind: '학습 가이드', where: '허브', title: '학습 가이드 — 공부 순서와 방법',
          text: '권장 경로 선수 지식 학습 목표 권장 순서 이론 실습 완료 기준 공부하는 방법 ' + guide.stages.map(s => s.name).join(' '), href: '/guide.html' });
        (guide.tracks || []).forEach(t => docs.push({ kind: '학습 가이드', where: '학습 트랙', title: `${t.title} 트랙`,
          text: [t.summary, t.audience, t.outcome, ...t.steps.map(s => s.roadmap)].join(' · '), href: '/guide.html#track-' + t.id }));
        guide.roadmaps.forEach(g => docs.push({ kind: '학습 가이드', where: g.title, aka: (g.aliases || []).join(' '), title: `${g.title} 학습 가이드`,
          text: [g.summary, ...g.levels.flatMap(l => [l.name, l.tagline, ...l.prereq, ...l.goals, ...l.outcomes])].filter(Boolean).join(' · '),
          href: `/guide.html#rm-${g.id}` }));
      }
      for (const s of REG.services || []) {
        const idx = await getJSON(`/${s.id}/content/index.json`);
        if (!idx) { down.push(s.title); continue; }
        const notes = idx.groups.flatMap(g => g.notes).filter(n => n.status === 'ready');
        await Promise.all(notes.map(async n => {
          const md = await fetch(`/${s.id}/content/${n.id}.md`, { cache: 'no-cache' }).then(r => r.ok ? r.text() : '').catch(() => '');
          docs.push({ kind: '심화 노트', where: s.title, title: `${n.title} · ${n.ko}`,
            text: `${n.summary} — ${md.replace(/```[\s\S]*?```/g, ' ').replace(/\[\[([\w-]+)\]\]/g, '$1').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1').replace(/[#*|`>-]+/g, ' ').replace(/\s+/g, ' ')}`,
            href: `/${s.id}/#/note/${n.id}` });
        }));
      }
      docs.forEach(d => { d._t = d.title.toLowerCase(); d._x = d.text.toLowerCase(); d._w = `${d.where} ${d.aka || ''}`.toLowerCase(); });
      DOCS = docs;
    })();
    return building;
  }

  function search(q) {
    const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!toks.length) return [];
    const W = { '항해도': 4, '심화 노트': 3, '과정': 2, '페이지': 1, '용어': 0, '학습 가이드': 1 };
    return DOCS.map(d => {
      let score = 0;
      for (const t of toks) {
        if (d._t.includes(t)) score += d._t.startsWith(t) ? 12 : 8;
        else if (d._x.includes(t)) score += 2;
        else if (d._w.includes(t)) score += 1;
        else return null;
      }
      return { d, score: score + W[d.kind] };
    }).filter(Boolean).sort((a, b) => b.score - a.score).slice(0, 40).map(x => x.d);
  }

  const hl = (s, toks) => toks.reduce((out, t) => out.replace(new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi'), m => `\u0001${m}\u0002`), s);
  const mark = (s, toks) => esc(hl(s, toks)).replace(/\u0001/g, '<mark>').replace(/\u0002/g, '</mark>');
  function snippet(text, toks) {
    const low = text.toLowerCase(); const i = Math.max(0, ...toks.map(t => low.indexOf(t)).filter(i => i >= 0).slice(0, 1));
    const start = Math.max(0, i - 40);
    return (start ? '… ' : '') + text.slice(start, start + 160);
  }

  function render() {
    const q = input.value.trim(); const toks = q.toLowerCase().split(/\s+/).filter(Boolean);
    status.textContent = DOCS ? `항해도 ${REG.roadmaps.length - down.filter(t => REG.roadmaps.some(r => r.title === t)).length}개 · 심화 노트 포함 ${DOCS.length}개 항목에서 검색` + (down.length ? ` · 응답 없음: ${down.join(', ')}` : '') : '검색 목록을 모으는 중…';
    if (!q) {
      results = [];
      list.innerHTML = `<li class="hs-empty">예: ${EXAMPLES.map(x => `<button type="button" data-q="${esc(x)}">${esc(x)}</button>`).join('')}</li>`;
      return;
    }
    results = DOCS ? search(q) : [];
    sel = 0;
    list.innerHTML = results.length ? results.map((d, i) => `<li class="hs-item" role="option" id="hs-${i}" aria-selected="${i === 0}">
        <a href="${esc(d.href)}"><div class="hs-row"><span class="hs-kind ${d.kind === '심화 노트' ? 'deep' : ''}">${esc(d.kind)}</span>
        <span class="hs-title">${mark(d.title, toks)}</span><span class="hs-where">${esc(d.where)}</span></div>
        ${d.text ? `<div class="hs-snip">${mark(snippet(d.text, toks), toks)}</div>` : ''}</a></li>`).join('')
      : `<li class="hs-empty">「${esc(q)}」에 맞는 결과가 없어요.</li>`;
  }
  function move(n) {
    if (!results.length) return;
    list.querySelector(`#hs-${sel}`)?.setAttribute('aria-selected', 'false');
    sel = (sel + n + results.length) % results.length;
    const li = list.querySelector(`#hs-${sel}`); li.setAttribute('aria-selected', 'true'); li.scrollIntoView({ block: 'nearest' });
    input.setAttribute('aria-activedescendant', `hs-${sel}`);
  }
  function go(href) { close(); if (href) location.href = href; }

  async function open() {
    lastFocus = document.activeElement; backdrop.hidden = false; input.value = input.value || ''; input.focus(); input.select();
    render(); await build(); render();
  }
  function close() { backdrop.hidden = true; lastFocus?.focus?.(); }

  input.addEventListener('input', render);
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter' && results[sel]) { e.preventDefault(); go(results[sel].href); }
  });
  list.addEventListener('click', e => {
    const b = e.target.closest('button[data-q]'); if (b) { input.value = b.dataset.q; input.focus(); render(); return; }
    const a = e.target.closest('a'); if (a) { e.preventDefault(); go(a.getAttribute('href')); }
  });
  backdrop.addEventListener('mousedown', e => { if (e.target === backdrop) close(); });

  // 확인용: ?hs=<검색어> 로 열면 검색창이 열린 채 시작
  const preset = new URLSearchParams(location.search).get('hs');
  if (preset) ready.then(r => { if (r) setTimeout(() => { input.value = preset; open(); }, 300); });
})();
</script>
<!-- hub-search:end -->

<script>
/* 진도 동기화: 클라우드 허브(로그인 + /api)에서만 동작합니다. 로컬 허브(Docker)·단독 실행에는 /api가 없어 아무것도 하지 않습니다.
   - 서버 → 브라우저: 다른 기기에서 한 진도를 가져와 합칩니다(완료·통과는 어느 쪽이든 유지).
   - 브라우저 → 서버: 진도 저장 키(storageKey)가 바뀌면 2초 모아 올립니다.
   - 열람 기록: 어느 화면(#/...)을 열었는지 남깁니다.  관리 화면: /admin/
   - 진도 영역(templates/progress-scope.html)이 이 사람의 영역(/api/me의 progressScope)과 같을 때만 서버와 합칩니다.
     게스트 진도는 서버 진도와 합치지 않습니다(게스트는 서버에 저장하지 않음).
   - 다른 탭에서 사용자가 바뀌면(진도 영역 스크립트의 hangdoScopeOk) 이 탭은 서버에 올리지 않습니다.  */
(() => {
  if (location.protocol === 'file:') return;
  const seg = location.pathname.split('/')[1] || '';
  const PORTAL = seg === '' || seg === 'index.html';
  const api = (p, o) => fetch(p, Object.assign({ credentials: 'same-origin', cache: 'no-store' }, o));
  const scopeLive = () => typeof window.hangdoScopeOk !== 'function' || window.hangdoScopeOk();   // 다른 탭에서 사용자가 바뀌었으면 올리지 않음
  const post = (p, body) => !scopeLive() ? Promise.resolve() : api(p, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) }).catch(() => {});
  const read = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
  const merge = (a, b) => {
    if (a === undefined || a === null) return b;
    if (b === undefined || b === null) return a;
    if (typeof a === 'boolean' && typeof b === 'boolean') return a || b;
    if (Array.isArray(a) && Array.isArray(b)) return [...new Set([...a, ...b].map(x => JSON.stringify(x)))].map(x => JSON.parse(x));
    if (typeof a === 'object' && typeof b === 'object') { const o = { ...b, ...a }; for (const k of Object.keys(o)) o[k] = merge(a[k], b[k]); return o; }
    return a;
  };
  (async () => {
    const me = await api('/api/me').then(r => r.ok ? r.json() : null).catch(() => null);
    if (!me) return;
    let scopeOk = true;
    try { scopeOk = !me.progressScope || localStorage.getItem('hangdo-progress-scope') === me.progressScope; } catch (e) {}
    if (!scopeOk && !sessionStorage.getItem('hangdo-scope-retry')) { sessionStorage.setItem('hangdo-scope-retry', '1'); location.reload(); return; }   // 영역 쿠키를 새로 받아 다시 맞춤
    const sync = scopeOk && !me.guest;      // 다른 사람의 진도이거나 게스트면 서버와 합치지도, 올리지도 않음
    const reg = await fetch('/roadmaps.json', { cache: 'no-cache' }).then(r => r.json()).catch(() => null);
    const list = (reg && reg.roadmaps) || [];
    const keys = PORTAL ? list.map(r => r.storageKey) : list.filter(r => r.id === seg).map(r => r.storageKey);
    // 조회자(viewer) 권한인 항해도는 진도를 서버에 저장하지 않음 (서버도 403으로 막음) — 브라우저에만 남김
    const idOf = Object.fromEntries(list.map(r => [r.storageKey, r.id]));
    const canSave = k => !me.roles || ['editor', 'admin'].includes(me.roles[idOf[k]]);
    const server = sync ? await api('/api/progress').then(r => r.json()).catch(() => ({ items: [] })) : { items: [] };
    const srv = Object.fromEntries((server.items || []).map(i => [i.site, i.state]));
    let changed = false;
    for (const k of keys) {
      const local = read(k), m = merge(local, srv[k]);
      if (m && JSON.stringify(m) !== JSON.stringify(local)) { localStorage.setItem(k, JSON.stringify(m)); changed = true; }
      if (sync && m && canSave(k) && JSON.stringify(m) !== JSON.stringify(srv[k])) post('/api/progress', { site: k, state: m });
    }
    if (changed && !sessionStorage.getItem('hangdo-synced-' + seg)) { sessionStorage.setItem('hangdo-synced-' + seg, '1'); location.reload(); return; }
    const timers = {};
    const orig = Storage.prototype.setItem;
    Storage.prototype.setItem = function (k, v) {
      orig.call(this, k, v);
      if (sync && this === localStorage && keys.includes(k) && canSave(k)) { clearTimeout(timers[k]); timers[k] = setTimeout(() => post('/api/progress', { site: k, state: read(k) || {} }), 2000); }
    };
    let last = '';
    const view = () => { const r = location.hash || '/'; if (r !== last) { last = r; post('/api/view', { site: PORTAL ? '' : seg, route: r }); } };
    view(); addEventListener('hashchange', view);
    const b = document.createElement('div');
    b.className = 'ps-badge';
    b.innerHTML = `<span></span>${me.admin ? ` · <a href="/admin/">관리${me.pending ? ` <b>(대기 ${Number(me.pending)})</b>` : ''}</a>` : ''}${(me.manages || []).length ? ` · <a href="/manage/">권한 관리</a>` : ''}${me.guest ? ' · 게스트(준비·기본)' : (!PORTAL && me.roles && me.roles[seg] === 'viewer') ? ' · 조회 전용(진도는 이 브라우저에만)' : ''} · <a href="/auth/logout">로그아웃</a>`;
    b.firstChild.textContent = me.login;
    const st = document.createElement('style');
    st.textContent = '.ps-badge{position:fixed;right:12px;bottom:12px;z-index:70;font:12px/1.4 system-ui,sans-serif;padding:6px 10px;border-radius:999px;background:var(--paper,#f2f5f7);color:var(--muted,#566778);border:1px solid var(--rule,#d3dce4)}.ps-badge a{color:inherit}';
    document.head.appendChild(st); document.body.appendChild(b);
  })();
})();
</script>
<!-- progress-sync:end -->
<!-- return-to:start v1.0.0 — 실습 항해도 공통 「이전 실습으로 돌아가기」 (Hands-On-Roadmap/templates/return-to.html에서 관리, 직접 고치지 말 것) -->
<script>
/* 이전 실습으로 돌아가기: 기본·중급·고급 실습 화면에서 준비 과정·선수 학습 링크(같은 항해도 또는 다른 항해도의 #/item/…)를 누르면
   그 목적지 화면에 「이전 실습으로 돌아가기」(원래 항해도·과정 이름·돌아갈 경로)를 보여 줍니다.
   - 기억하는 곳: sessionStorage(hangdo-return) — 이 탭에서만, 새로고침해도 유지, 탭을 닫으면 사라짐. 6시간이 지나면 버림.
   - 주소로 직접 들어오면(기록 없음) 보이지 않습니다. 원래 실습으로 돌아오면(링크·뒤로 가기 모두) 기록을 지웁니다.
   - 돌아갈 경로는 같은 사이트의 「/<항해도>/#/item/<id>」 형태만 허용합니다(외부 주소·//host·인코딩 우회·javascript: 모두 거부).
   - 화면 주소·방문 기록은 건드리지 않아 브라우저 뒤로 가기와 충돌하지 않습니다. */
(() => {
  if (location.protocol === 'file:') return;
  const KEY = 'hangdo-return', TTL = 6 * 3600e3;
  const SRC_LEVELS = ['basic', 'intermediate', 'advanced', '기초', '기본', '중급', '고급'];
  const PREP_LEVELS = ['prep', '준비'];
  const ITEM_PATH = /^\/(?:[a-z0-9-]{1,40}\/)?(?:index\.html)?#\/item\/[A-Za-z0-9_.-]{1,80}$/;
  const safePath = p => {                                  // 같은 사이트의 과정 화면 상대 경로만 (그 외는 null)
    if (typeof p !== 'string' || p.length > 200 || !ITEM_PATH.test(p)) return null;
    try { const u = new URL(p, location.origin); return u.origin === location.origin && u.pathname + u.hash === p ? p : null; } catch (e) { return null; }
  };
  const itemOf = hash => { const m = /^#\/item\/([A-Za-z0-9_.-]{1,80})(?:[?#].*)?$/.exec(hash || ''); return m ? m[1] : null; };
  const here = () => { const id = itemOf(location.hash); return id ? safePath(location.pathname + '#/item/' + id) : null; };
  const read = () => {
    let s = null; try { s = JSON.parse(sessionStorage.getItem(KEY) || 'null'); } catch (e) {}
    if (!s || typeof s !== 'object' || !safePath(s.from) || !safePath(s.to) || !(Date.now() - s.ts < TTL)) { if (s) clear(); return null; }
    return s;
  };
  const clear = () => { try { sessionStorage.removeItem(KEY); } catch (e) {} };
  const firstTitle = (document.title || '').split(' — ').pop();
  let ITEMS = null, RM = firstTitle;
  fetch('content/catalog.json', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(c => {
    if (!c || !Array.isArray(c.items)) return;
    ITEMS = Object.fromEntries(c.items.map(i => [i.id, i]));
    if (c.meta && c.meta.title) RM = c.meta.title;
  }).catch(() => {});
  const seg = location.pathname.split('/')[1] || '';
  if (seg && seg !== 'index.html') fetch('/roadmaps.json', { credentials: 'same-origin' }).then(r => r.ok ? r.json() : null).then(reg => {
    const r = reg && (reg.roadmaps || []).find(x => x.id === seg); if (r && r.title) RM = r.title;
  }).catch(() => {});

  // 기본·중급·고급 실습 화면에서 준비·선수 학습 링크를 누를 때 기록 (이동 전에 동기로)
  document.addEventListener('click', e => {
    if (e.button !== 0 || !ITEMS) return;
    const a = e.target.closest && e.target.closest('a[href]'); if (!a) return;
    const src = ITEMS[itemOf(location.hash)]; if (!src || !SRC_LEVELS.includes(src.level)) return;
    let u; try { u = new URL(a.getAttribute('href'), location.href); } catch (x) { return; }
    if (u.origin !== location.origin) return;
    const dest = itemOf(u.hash); if (!dest) return;
    if (u.pathname === location.pathname) {
      const d = ITEMS[dest];
      if (dest === src.id || !d || !(PREP_LEVELS.includes(d.level) || (src.prereq || []).includes(dest) || dest === 'setup')) return;
    } else if (!/^\/[a-z0-9-]{1,40}\/(?:index\.html)?$/.test(u.pathname)) return;   // 다른 항해도의 과정
    const from = safePath(location.pathname + '#/item/' + src.id), to = safePath(u.pathname + '#/item/' + dest);
    if (!from || !to || from === to) return;
    try { sessionStorage.setItem(KEY, JSON.stringify({ from, to, roadmap: String(RM).slice(0, 80), item: String(src.title || src.id).slice(0, 120), ts: Date.now() })); } catch (x) {}
  }, true);

  // 목적지 화면에 안내 (돌아오면 기록 지움)
  const show = () => {
    const old = document.getElementById('hangdo-return'); if (old) old.remove();
    const s = read(), cur = here();
    if (!s || !cur) return;
    if (cur === s.from) { clear(); return; }
    if (cur !== s.to) return;
    const nav = document.createElement('nav');
    nav.id = 'hangdo-return'; nav.setAttribute('aria-label', '이전 실습으로 돌아가기');
    nav.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:75;max-width:min(440px,calc(100vw - 24px));display:grid;gap:2px;padding:10px 40px 10px 14px;border-radius:12px;font:13px/1.45 system-ui,sans-serif;background:var(--paper,#fff);color:var(--ink,#1b2733);border:1px solid var(--chart,#2c6fb3);box-shadow:0 6px 20px rgba(0,0,0,.15)';
    const link = document.createElement('a');
    link.setAttribute('href', s.from); link.textContent = '↩ 이전 실습으로 돌아가기';
    link.style.cssText = 'font-weight:700;color:var(--chart,#2c6fb3)';
    link.addEventListener('click', clear);
    const where = document.createElement('span');
    where.textContent = `${s.roadmap} · ${s.item}`;
    const path = document.createElement('code');
    path.textContent = s.from; path.style.cssText = 'font-size:12px;color:var(--muted,#566778);overflow-wrap:anywhere';
    const x = document.createElement('button');
    x.type = 'button'; x.textContent = '×'; x.setAttribute('aria-label', '돌아가기 안내 닫기');
    x.style.cssText = 'position:absolute;right:6px;top:6px;width:28px;height:28px;border:0;border-radius:6px;background:transparent;color:inherit;font-size:18px;line-height:1;cursor:pointer';
    x.addEventListener('click', () => { clear(); nav.remove(); });
    nav.append(link, where, path, x);
    document.body.appendChild(nav);
  };
  addEventListener('hashchange', show);
  addEventListener('pageshow', show);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show); else show();
})();
</script>
<!-- return-to:end -->
