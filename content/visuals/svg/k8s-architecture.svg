<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 849 740" width="849" height="740" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="t">쿠버네티스 구성: 컨트롤 플레인과 노드</title>
<desc id="d">컨트롤 플레인에는 모든 구성 요소의 유일한 창구인 kube-apiserver, 모든 객체를 저장하는 etcd, 새 Pod를 둘 노드를 고르는 scheduler, 제어 루프 모음인 controller-manager가 있습니다. 노드마다 kubelet(Pod 실행·상태 보고), 컨테이너 런타임(containerd → runc), kube-proxy(Service 주소 → Pod)가 있고 모두 API로 보고·지시를 받습니다.</desc>
