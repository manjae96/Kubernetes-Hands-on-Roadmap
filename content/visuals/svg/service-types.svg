<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 581 506" width="581" height="506" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="t">Service 유형의 포함 관계</title>
<desc id="d">ClusterIP는 클러스터 안의 가상 IP, NodePort는 모든 노드의 IP:30000~32767을 더하고(ClusterIP 포함), LoadBalancer는 클라우드 LB의 외부 IP를 더합니다(NodePort 포함). 세 유형 모두 kube-proxy가 selector로 고른 파드로 전달합니다. ExternalName은 프록시 없이 바깥 DNS 이름으로 CNAME만 돌려줍니다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="581" height="506" rx="12" fill="#f8fafc"/>
<path d="M150.6 105 L150.6 161" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M150.6 242 L150.6 298" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M150.6 362 L150.6 418" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="156.6" y="384" width="119.3" height="18" fill="#f8fafc" opacity="0.92"/>
<text x="160.6" y="397" font-size="12.5" fill="#334155">kube-proxy가 전달</text>
<rect x="41" y="24" width="219.2" height="81" rx="9" fill="#e6efff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="150.6" y="52" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">LoadBalancer</text>
<text x="150.6" y="73" font-size="12.5" text-anchor="middle" fill="#334155">클라우드 LB의 외부 IP (NodePort</text>
<text x="150.6" y="90" font-size="12.5" text-anchor="middle" fill="#334155">포함)</text>
<rect x="24" y="161" width="253.2" height="81" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="150.6" y="189" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">NodePort</text>
<text x="150.6" y="210" font-size="12.5" text-anchor="middle" fill="#334155">모든 노드 IP:30000~32767 (ClusterIP</text>
<text x="150.6" y="227" font-size="12.5" text-anchor="middle" fill="#334155">포함)</text>
<rect x="62.8" y="298" width="175.8" height="64" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="150.6" y="326" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">ClusterIP</text>
<text x="150.6" y="347" font-size="12.5" text-anchor="middle" fill="#334155">클러스터 안의 가상 IP:포트</text>
<rect x="91.6" y="418" width="118" height="64" rx="9" fill="#e7f6ec" stroke="#15803d" stroke-width="1.6"/>
<text x="150.6" y="446" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">Pod들</text>
<text x="150.6" y="467" font-size="12.5" text-anchor="middle" fill="#334155">selector로 고름</text>
<rect x="337.2" y="24" width="219.9" height="81" rx="9" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="1 3"/>
<text x="447.2" y="52" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">ExternalName</text>
<text x="447.2" y="73" font-size="12.5" text-anchor="middle" fill="#334155">클러스터 안 이름 → 바깥 DNS 이름</text>
<text x="447.2" y="90" font-size="12.5" text-anchor="middle" fill="#334155">(CNAME, 프록시 없음)</text>
</svg>
