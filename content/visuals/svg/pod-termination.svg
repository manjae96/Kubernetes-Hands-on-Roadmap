<text x="145.7" y="52" font-size="14" font-weight="700" text-anchor="middle" fill="#334155">Pod 삭제 요청</text>
<rect x="33.7" y="101" width="223.9" height="64" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="145.7" y="129" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">① Service 엔드포인트에서 빠짐</text>
<text x="145.7" y="150" font-size="12.5" text-anchor="middle" fill="#334155">새 요청이 안 오게</text>
<rect x="73.9" y="199" width="143.6" height="64" rx="9" fill="#ffffff" stroke="#64748b" stroke-width="1.6"/>
<text x="145.7" y="227" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">② preStop 훅 실행</text>
<text x="145.7" y="248" font-size="12.5" text-anchor="middle" fill="#334155">있으면</text>
<rect x="49.6" y="297" width="192.1" height="64" rx="9" fill="#e6efff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="145.7" y="325" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">③ PID 1에 SIGTERM</text>
<text x="145.7" y="346" font-size="12.5" text-anchor="middle" fill="#334155">앱: 연결 마무리·저장 후 종료</text>
<rect x="24" y="403" width="243.4" height="81" rx="9" fill="#fdecec" stroke="#b91c1c" stroke-width="1.6" stroke-dasharray="3 3"/>
<text x="145.7" y="431" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">④ SIGKILL</text>
<text x="145.7" y="452" font-size="12.5" text-anchor="middle" fill="#334155">terminationGracePeriodSeconds(기</text>
<text x="145.7" y="469" font-size="12.5" text-anchor="middle" fill="#334155">본 30초) 뒤에도 살아 있으면</text>
