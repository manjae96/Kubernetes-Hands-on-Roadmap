<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 291 508" width="291" height="508" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="t">파드가 끝날 때의 순서</title>
<desc id="d">파드 삭제 요청이 오면 ① Service 엔드포인트에서 빠지고 ② preStop 훅이 있으면 실행하고 ③ 컨테이너 PID 1에 SIGTERM을 보내 앱이 연결을 마무리하게 하며 ④ terminationGracePeriodSeconds(기본 30초)가 지나도 살아 있으면 SIGKILL로 끝냅니다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="291" height="508" rx="12" fill="#f8fafc"/>
<path d="M145.7 67 L145.7 101" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M145.7 165 L145.7 199" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M145.7 263 L145.7 297" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<path d="M145.7 361 L145.7 403" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="151.7" y="376" width="61.8" height="18" fill="#f8fafc" opacity="0.92"/>
