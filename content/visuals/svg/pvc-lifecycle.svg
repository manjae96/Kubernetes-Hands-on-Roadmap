<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 862 310" width="862" height="310" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="t">PVC의 상태 변화와 회수 정책</title>
<desc id="d">PVC를 만들면 Pending이었다가 StorageClass가 PV를 만들어 묶으면 Bound가 되고 파드가 마운트해 씁니다. PVC를 지우면 회수 정책에 따라 Delete는 PV와 데이터를 지우고, Retain은 PV를 Released 상태로 남깁니다.</desc>
