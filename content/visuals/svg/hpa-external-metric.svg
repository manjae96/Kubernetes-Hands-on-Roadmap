<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 609" width="720" height="609" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="t">큐 길이로 0까지 줄이기: 외부 메트릭 HPA 경로</title>
<desc id="d">HPA 컨트롤러가 external.metrics.k8s.io에 묻고, prometheus-adapter가 PromQL로 Prometheus에 질의합니다. Prometheus는 Pushgateway를 scrape해 queue_messages_ready{queue=&quot;orders&quot;} 값을 얻고(실습에서는 큐 대신 Pushgateway에 직접 기록), HPA가 그 값으로 큐 작업자를 늘리거나 줄입니다.</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#475569"/></marker></defs>
<rect width="720" height="609" rx="12" fill="#f8fafc"/>
<text x="24" y="59" font-size="12.5" font-weight="700" fill="#334155">1. 묻기</text>
