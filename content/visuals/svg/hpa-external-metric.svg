<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1087 249" width="1087" height="249" role="img" aria-labelledby="t d" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif">
<title id="t">큐 길이로 0까지 줄이기: 외부 메트릭 HPA 경로</title>
<desc id="d">HPA 컨트롤러가 external.metrics.k8s.io에 묻고, prometheus-adapter가 PromQL로 Prometheus에 질의합니다. Prometheus는 Pushgateway를 scrape해 queue_messages_ready{queue=&quot;orders&quot;} 값을 얻고(실습에서는 큐 대신 Pushgateway에 직접 기록), HPA가 그 값으로 큐 작업자를 늘리거나 줄입니다.</desc>
