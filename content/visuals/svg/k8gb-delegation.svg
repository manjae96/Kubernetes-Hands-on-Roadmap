<text x="392.7" y="329" font-size="12.5" fill="#334155">eu 장애 때 답</text>
<rect x="38" y="68" width="422.8" height="64" rx="9" fill="#e6efff" stroke="#1d4ed8" stroke-width="1.6"/>
<text x="249.4" y="96" font-size="14" font-weight="700" text-anchor="middle" fill="#0f172a">엣지 DNS (example.com 권한)</text>
